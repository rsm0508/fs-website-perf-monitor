name: Monitor New URLs

on:
  schedule:
    - cron: '15 * * * *'  # hourly at :15
  workflow_dispatch:

concurrency:
  group: perf-monitor-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Init DB if missing
        run: |
          if [ ! -f data/perf.db ]; then npm run init-db; fi
      - name: Select new + changed
        id: select
        run: |
          node scripts/select-urls.js --mode new > /tmp/urls.txt
          echo "count=$(wc -l < /tmp/urls.txt)" >> $GITHUB_OUTPUT
      - name: Exit if no new URLs
        if: steps.select.outputs.count == '0'
        run: echo "Nothing new. Exiting."
      - name: Run Lighthouse
        if: steps.select.outputs.count != '0'
        run: cat /tmp/urls.txt | node scripts/run-lighthouse.js
      - name: Detect regressions
        if: steps.select.outputs.count != '0'
        run: node scripts/detect-regressions.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Notify
        if: steps.select.outputs.count != '0'
        run: node scripts/notify.js
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_PORT:           ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:         ${{ secrets.SMTP_SECURE }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          SMTP_FROM:           ${{ secrets.SMTP_FROM }}
          NOTIFY_EMAIL:        ${{ secrets.NOTIFY_EMAIL }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Commit results
        if: steps.select.outputs.count != '0'
        run: |
          git config user.name "perf-monitor-bot"
          git config user.email "actions@github.com"
          git add data/ reports/
          git diff --staged --quiet || git commit -m "chore(perf): new/changed URLs tested"
          git push
