name: Discover URLs

on:
  schedule:
    - cron: '0 6 * * *'  # daily 06:00 UTC
  workflow_dispatch:

concurrency:
  group: perf-monitor-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Init DB if missing
        run: |
          if [ ! -f data/perf.db ]; then
            npm run init-db
          fi
      - name: Run discovery
        run: npm run discover
      - name: Commit changes
        run: |
          git config user.name "perf-monitor-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore(perf): daily URL discovery"
          git push
      - name: Trigger new-URL run
        if: success()
        run: |
          gh workflow run monitor-new.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
