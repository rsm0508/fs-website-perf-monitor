# Not a standalone workflow. Copy this structure into each monitor workflow.
# Kept as a reference for what the monitor jobs do.

# Steps every monitor workflow performs:
# 1. Checkout main
# 2. Pull latest data/perf.db to avoid overwriting concurrent writes (use concurrency: group)
# 3. Setup Node 20
# 4. npm ci
# 5. Install Chrome (via browser-actions/setup-chrome or apt)
# 6. Init DB if missing
# 7. select-urls.js --mode <mode> > urls.txt
# 8. Pipe urls.txt into run-lighthouse.js
# 9. detect-regressions.js
# 10. Commit data/perf.db, reports/, dashboard/ back to main
